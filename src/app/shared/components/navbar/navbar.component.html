<mat-toolbar class="navbar">

    <!-- 🏷️ Logo da loja (tamanho otimizado para celular) -->
    <a routerLink="/" class="logo">
        Tech-Info+
    </a>

    <span class="spacer"></span>

    <!-- 💻 Menu visível em telas grandes (Desktop) -->
    <nav class="menu-desktop">
        <a mat-button routerLink="/">
            Home
        </a>
        <a mat-button routerLink="/meus-pedidos">
            Pedidos
        </a>
    </nav>

    <div class="actions-group">
        <!-- 🛒 Ícone do Carrinho -->
        <button
            mat-icon-button
            routerLink="/cart"
            [matBadge]="cartCount$ | async"
            matBadgeColor="warn"
            title="Carrinho"
            class="action-btn">
            <mat-icon>shopping_cart</mat-icon>
        </button>

        <!-- 📱 Botão Menu Mobile (Troca para ícone de Apps/Grid para evitar corte) -->
        <button
            mat-icon-button
            [matMenuTriggerFor]="mobileMenu"
            class="mobile-menu-btn"
            title="Menu">
            <mat-icon>grid_view</mat-icon>
        </button>

        <!-- 👤 Botão de Perfil / Usuário -->
        <button
            mat-icon-button
            [matMenuTriggerFor]="userMenu"
            class="user-menu-btn"
            title="Conta">
            <mat-icon>account_circle</mat-icon>
        </button>
    </div>

</mat-toolbar>

<!-- 📱 Menu Dropdown Mobile (Aparece ao tocar no botão de grade) -->
<mat-menu #mobileMenu="matMenu" class="mobile-dropdown-panel">
    <button mat-menu-item routerLink="/">
        <mat-icon>home</mat-icon>
        <span>Home</span>
    </button>
    <button mat-menu-item routerLink="/meus-pedidos">
        <mat-icon>receipt_long</mat-icon>
        <span>Meus Pedidos</span>
    </button>
</mat-menu>

<!-- ⚙️ Menu Dropdown do Usuário -->
<mat-menu #userMenu="matMenu">
    <button mat-menu-item routerLink="/profile">
        <mat-icon>person</mat-icon>
        <span>Perfil</span>
    </button>

    <button
        *ngIf="isAdmin()"
        mat-menu-item
        routerLink="/admin/products">
        <mat-icon>admin_panel_settings</mat-icon>
        <span>Administração</span>
    </button>

    <button
        mat-menu-item
        (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sair</span>
    </button>
</mat-menu>
