<div *ngIf="product as p">

  <img
    *ngIf="p.imageUrl"
    [src]="p.imageUrl"
    [alt]="p.name"
    width="300">

  <h2>{{ p.name }}</h2>

  <p>{{ p.description }}</p>

  <p>{{ p.details }}</p>

  <strong>
    {{ p.price | currency:'BRL' }}
  </strong>

  <p *ngIf="p.stock !== undefined">Estoque: {{ p.stock }}</p>
  <p *ngIf="p.active === false" style="color:#ef4444;">Indisponível</p>

  <button (click)="addToCart()">
    Adicionar ao carrinho
  </button>

  <a routerLink="/checkout" class="checkout-btn" (click)="finalizarCompra()">
    Finalizar Compra
  </a>

  <div *ngIf="total > 0" class="total-info">
    <strong>Total estimado: {{ total | currency:'BRL' }}</strong>
  </div>

</div>
